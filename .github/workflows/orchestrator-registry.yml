name: Orchestrator registry validation
on:
  push:
    paths:
      - 'config/engine_registry.json'
      - 'scripts/validate_registry.py'
      - '.github/workflows/orchestrator-registry.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/validate_registry.py
