name: Audit registry contract tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-registry-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test registry, collector and shared audit contracts
        run: python -m unittest discover -s tests -v
      - name: Compile source
        run: python -m compileall -q audit_registry scripts
